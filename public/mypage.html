<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ENDPoinT | 마이페이지</title>
<link href="/css/dashboard.css" rel="stylesheet"/>
<link href="/css/mypage.css" rel="stylesheet"/>
<script src="/js/mypage.js" type="module"></script>
<link href="/css/design-system.css" rel="stylesheet"/></head>
<body class="mypage">
<header class="topbar"><a aria-label="ENDPoinT 홈으로 이동" class="logo" href="/index.html"><span class="logo-icon">E</span><span>ENDPoinT</span></a><nav aria-label="주요 메뉴" class="primary-nav"><a href="/index.html">대시보드</a><a href="/grade-analysis.html">성적 분석</a><a href="/calendar.html">캘린더</a><a aria-current="page" href="/mypage.html">사용자 정보</a></nav><div class="user-area">
<span id="user-name">사용자</span>
<button class="logout-button" disabled="" id="logout-button" type="button">로그아웃</button>
</div>
</header>
<main class="main-content">
<nav aria-label="대시보드 이동" class="analysis-navigation">
<a class="secondary-button" href="/index.html">← 학업 대시보드로 돌아가기</a>
</nav>
<section class="welcome-section"><div class="welcome-copy">
<p class="eyebrow">MY ACCOUNT</p>
<h1>사용자 정보</h1>
<p class="subtitle">내 회원정보를 확인하고 변경하세요.</p>
</div></section>
<form aria-busy="true" class="profile-card" id="profile-form">
<fieldset disabled="" id="profile-fields">
<legend>회원정보 수정</legend>
<div class="profile-grid">
<div class="profile-field">
<label for="name">이름</label>
<input autocomplete="name" id="name" maxlength="50" name="name" required=""/>
</div>
<div class="profile-field">
<label for="email">아이디(이메일)</label>
<input aria-describedby="email-hint" autocomplete="username" id="email" maxlength="254" name="email" required="" type="email"/>
<p class="field-hint" id="email-hint">변경한 이메일로 로그인하게 됩니다.</p>
</div>
<div class="profile-field profile-wide">
<label for="department">학과</label>
<input autocomplete="organization-title" id="department" maxlength="100" name="department" placeholder="예: 컴퓨터공학과"/>
</div>
<div class="major-options profile-wide">
<p class="field-hint" id="major-hint">복수전공·부전공을 선택하면 옆에 전공명을 입력해 주세요. 둘 다 선택할 수 있습니다.</p>
<div class="major-option">
<label class="major-toggle" for="has-double-major">
<input aria-controls="double-major" aria-describedby="major-hint" id="has-double-major" type="checkbox"/>
                                복수전공
                            </label>
<input aria-label="복수전공 전공명" class="major-name" disabled="" id="double-major" maxlength="100" name="doubleMajor" placeholder="예: 경영학과"/>
</div>
<div class="major-option">
<label class="major-toggle" for="has-minor">
<input aria-controls="minor" aria-describedby="major-hint" id="has-minor" type="checkbox"/>
                                부전공
                            </label>
<input aria-label="부전공 전공명" class="major-name" disabled="" id="minor" maxlength="100" name="minor" placeholder="예: 수학과"/>
</div>
</div>
</div>
<section aria-labelledby="password-title" class="password-section">
<h2 id="password-title">비밀번호 변경</h2>
<p class="field-hint" id="password-hint">비밀번호를 변경하지 않을 때는 새 비밀번호 두 칸을 비워두세요. 새 비밀번호는 15~128자입니다.</p>
<div class="profile-grid">
<div class="profile-field profile-wide">
<label for="current-password">현재 비밀번호 (이메일 또는 비밀번호 변경 시 필수)</label>
<input aria-describedby="current-password-hint" autocomplete="current-password" id="current-password" maxlength="128" name="currentPassword" type="password"/>
<p class="field-hint" id="current-password-hint">이름·학과 등 일반 정보만 바꾸는 경우에는 입력하지 않아도 됩니다.</p>
</div>
<div class="profile-field">
<label for="password">새 비밀번호</label>
<input aria-describedby="password-hint password-strength" autocomplete="new-password" id="password" maxlength="128" minlength="15" name="password" type="password"/>
<p aria-live="polite" class="field-hint" id="password-strength" role="status"></p>
</div>
<div class="profile-field">
<label for="password-confirm">새 비밀번호 확인</label>
<input aria-describedby="password-match" autocomplete="new-password" id="password-confirm" maxlength="128" minlength="15" name="passwordConfirm" type="password"/>
<p aria-live="polite" class="field-hint" id="password-match" role="status"></p>
</div>
</div>
</section>
<div class="profile-actions">
<button class="primary-button" id="save-profile" type="submit">변경사항 저장</button>
<button class="secondary-button" id="reset-profile" type="button">변경사항 취소</button>
</div>
</fieldset>
</form>
<p aria-live="polite" class="profile-message" id="profile-message" role="status">회원정보를 불러오는 중입니다.</p>
<button class="secondary-button" hidden="" id="retry-profile" type="button">다시 불러오기</button>
<noscript>회원정보를 수정하려면 브라우저에서 JavaScript를 활성화해 주세요.</noscript>
</main>
</body>
</html>
